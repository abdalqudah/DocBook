# ALTERNATIVE to Caddy (compose.yaml uses Caddy). Use this only if you run nginx on the server itself:
#   1. in compose.yaml remove the "proxy" service and give the app   ports: ["127.0.0.1:3000:3000"]
#   2. sudo apt install nginx certbot python3-certbot-nginx
#   3. copy this file to /etc/nginx/sites-available/medworks, link it into sites-enabled, replace medworks.app
#   4. sudo certbot --nginx -d medworks.app -d www.medworks.app   (certbot renews by itself with its systemd timer)
# Clinics' custom domains need their own certificate each with this set-up (certbot -d their.domain); Caddy does that
# automatically, which is why it is the default.
upstream medworks_app { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name medworks.app www.medworks.app;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://medworks.app$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.medworks.app;
    ssl_certificate     /etc/letsencrypt/live/medworks.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medworks.app/privkey.pem;
    return 301 https://medworks.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name medworks.app;
    ssl_certificate     /etc/letsencrypt/live/medworks.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medworks.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Uploads: the app enforces each form's own limit (up to several GB for a clinic's data import).
    client_max_body_size 0;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # Request paths can carry private link tokens: no access log (the app keeps its own audit log).
    access_log off;

    location /internal/ { return 404; }
    location / {
        proxy_pass http://medworks_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_request_buffering off;
    }
}
