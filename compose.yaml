# MedWorks on one server: the app, MariaDB and Caddy (HTTPS with certificates it obtains and renews by itself).
# Only Caddy listens on the internet (80, 443). The database has no published port; the app listens on the internal
# network only. Settings: .env next to this file (copy deploy/.env.production.example). Data: the named volumes below.
#   docker compose up -d --build        start / update
#   docker compose ps                   health of every service
#   docker compose logs -f app          the app's log
name: medworks

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-medworks}
      MARIADB_USER: ${DB_USER:-medworks}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max-connections=300
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-512M}
      - --max-allowed-packet=256M
    volumes:
      - db_data:/var/lib/mysql
      - ./deploy/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [internal]
    logging: &logging
      driver: local
      options: { max-size: "20m", max-file: "5" }

  app:
    build: .
    image: medworks-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      NODE_ENV: production
      STRICT_CONFIG: "true"
      MEDWORKS_CONTAINER: "1"
      TRUST_PROXY: "true"
      # The app never needs these (they stay with the database and the backup script).
      DB_ROOT_PASSWORD: ""
      BACKUP_PASSPHRASE: ""
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - app_storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 20s
    expose: ["3000"]
    networks: [internal, web]
    logging: *logging

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. medworks.app}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    logging: *logging

volumes:
  db_data:
  app_storage:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
